name: "CodeQL"

on:
  push:
    branches: [ "universe" ]
  pull_request:
    branches: [ "universe" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'actions' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        output: ${{ runner.temp }}/results
        upload: false

    - name: Validate SARIF file
      run: |
        SARIF_FILE="${{ runner.temp }}/results/${{ matrix.language }}.sarif"
        
        # Check if SARIF file exists
        if [ ! -f "$SARIF_FILE" ]; then
          echo "Error: SARIF file does not exist at $SARIF_FILE"
          echo "Searching for SARIF files in results directory..."
          find "${{ runner.temp }}/results" -name "*.sarif" || echo "No SARIF files found"
          exit 1
        fi
        
        # Check if SARIF file is not empty
        if [ ! -s "$SARIF_FILE" ]; then
          echo "Error: SARIF file is empty"
          exit 1
        fi
        
        # Display file size for debugging (GNU stat for Linux, BSD stat for macOS)
        FILE_SIZE=$(stat -c%s "$SARIF_FILE" 2>/dev/null || stat -f%z "$SARIF_FILE" 2>/dev/null)
        echo "SARIF file size: ${FILE_SIZE} bytes"
        
        # Validate that the file size is reasonable (minimum valid SARIF is ~20 bytes)
        if [ "$FILE_SIZE" -lt 20 ]; then
          echo "Error: SARIF file is too small (less than 20 bytes)"
          exit 1
        fi
        
        # Check if file is valid JSON by attempting to parse it
        if ! python3 -m json.tool "$SARIF_FILE" > /dev/null 2>&1; then
          echo "Error: SARIF file is not valid JSON"
          exit 1
        fi
        
        echo "SARIF file validated successfully"

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/results/${{ matrix.language }}.sarif
        category: "/language:${{matrix.language}}"
